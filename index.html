/* V5.4 AI illustration + interaction fixes */
.topbar{justify-content:flex-end}
.breadcrumb,.eyebrow,.v5-kicker,.v52-eyebrow,.v5-report-overline,.footer,.v5-section-head>span,.monthly-banner small,.emergency-note,.caution,.trace{display:none !important}
.photo-pick-btn{position:relative;overflow:hidden}
.v5-act-art{min-height:168px}
.v5-illustration,.v5-illustration-photo{width:100%;height:100%;max-height:none;object-fit:cover;display:block}
.v5-detail-hero .v5-illustration{height:190px;border-radius:18px;background:#edf2e9}
.v5-detail-hero img{display:block;width:100%;height:190px;object-fit:cover;border-radius:18px;background:#edf2e9}

/* V5.5 mature visual refinement */
:root{
  --bg:#f5f4ef;
  --surface:#fffdfa;
  --ink:#1f2924;
  --muted:#6f7b73;
  --line:#e7e5dd;
  --green:#3f6b56;
  --green-dark:#2f5745;
  --mint:#eef3ee;
  --sand:#f6f1e8;
  --shadow:0 10px 30px rgba(31,41,36,.045),0 2px 8px rgba(31,41,36,.03);
  --radius:22px;
}
body{background:linear-gradient(180deg,#f7f6f1 0%,#f4f2ed 100%);color:var(--ink)}
.layout{max-width:1680px}
.side{background:rgba(251,251,248,.86);backdrop-filter:blur(10px);border-right:1px solid #ebe9e2}
.brand{padding:2px 12px 0}
.main{padding:0 clamp(20px,4vw,72px) 92px}
.topbar{position:sticky;top:0;z-index:20;min-height:82px;background:rgba(247,246,241,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(229,227,218,.95)}
.top-actions{gap:10px}
.v5-top-shortcut,.smalltag{min-height:42px;padding:0 15px;border-radius:14px;border:1px solid #e4e4dc;background:rgba(255,255,255,.88);color:#55665c;box-shadow:0 2px 6px rgba(31,41,36,.02)}
.top-actions .v5-top-shortcut:hover,.smalltag:hover{background:#fff;border-color:#dad9d1}
.content{max-width:1120px;padding-bottom:40px}
.page-header{margin:28px 0 24px;align-items:flex-start}
.heading{font-size:clamp(30px,4vw,48px);line-height:1.12;letter-spacing:-.055em;margin:0 0 10px;font-weight:860}
.desc{font-size:16px;line-height:1.8;color:#738078;max-width:760px}
.btn{min-height:46px;padding:0 18px;border-radius:14px;border-color:#e4e3da;font-size:14px;font-weight:760;box-shadow:0 1px 2px rgba(31,41,36,.02)}
.btn.primary{background:linear-gradient(180deg,#456f5b 0%,#345a49 100%);border-color:#345a49;box-shadow:0 10px 18px rgba(52,90,73,.16)}
.btn.soft{background:#f1f5f1;border-color:#e1e8e1;color:#355643}
.btn.outline,.btn:not(.primary):not(.soft):not(.quiet):not(.danger){background:#fff}
.card{border-radius:24px;border:1px solid #ebe8df;box-shadow:var(--shadow)}
.welcome,.v5-now-section,.v5-report-wrap,.sheet,.v5-detail{border-radius:28px;box-shadow:0 18px 48px rgba(31,41,36,.06),0 2px 8px rgba(31,41,36,.025)}
.welcome{background:linear-gradient(135deg,#eef3ee 0%,#e8efe9 100%);border-color:#e1e8e1;padding:30px 30px 28px}
.welcome h2,.v5-home-head h1,.v5-report-title h2{letter-spacing:-.05em}

<script>const MONTH_GUIDES=[{"month":1,"title":"第 1 个月","focus":"建立喂养和睡眠节奏，先看吃、睡、安抚和精神状态。","motor":["短时清醒趴卧，先少量多次。","抱起时注意头颈支撑。"],"language":["多对视、多轻声说话。","听熟悉声音会更安静。"],"social":["会看人脸，开始偏好熟悉照护者。"],"support":["先做稳定照护流程。","吃奶、拍嗝、抱读、睡觉反复重复。"],"red":["吃奶无力、难叫醒、呼吸费力要尽快联系医生。"],"feeding":"这个月以母乳或配方奶为主，不安排辅食。"},{"month":2,"title":"第 2 个月","focus":"开始更多注视、微笑和对声音的反应。","motor":["趴着时尝试抬头。","手脚活动更有力。"],"language":["会听熟悉声音。","适合面对面说话。"],"social":["开始出现社交性微笑。"],"support":["每天多次短时趴玩。","看脸、唱歌、回应宝宝发声。"],"red":["对声音或人脸反应很少需要留意。"],"feeding":"仍以奶为主，不安排辅食。"},{"month":3,"title":"第 3 个月","focus":"头控进步，白天清醒时间开始拉长。","motor":["趴玩时头抬得更稳。","更主动踢腿挥手。"],"language":["会发出简单喉音。"],"social":["会更明显等待互动。"],"support":["形成吃奶—玩—睡的大致节奏。","每次清醒窗安排一段短互动。"],"red":["持续不愿吃奶或头控完全没进步时应咨询。"],"feeding":"仍以奶为主，不安排辅食。"},{"month":4,"title":"第 4 个月","focus":"探索欲增强，可能准备翻身。","motor":["趴着更稳地撑起上身。","会抓玩具和尝试翻身。"],"language":["会用声音表达开心。"],"social":["看到熟悉人会更兴奋。"],"support":["安排抓握、追视、躲猫猫、唱歌。","给更多地面活动时间。"],"red":["不看人、不笑、对声音反应少时要留意。"],"feeding":"通常仍以奶为主，4 个月前不建议添加辅食。"},{"month":5,"title":"第 5 个月","focus":"翻身和抓握意愿增强。","motor":["更想翻身和够物。","口欲期增强。"],"language":["咿呀发声增多。"],"social":["更主动找人互动。"],"support":["镜子互动、布书、抓握游戏很适合。"],"red":["吞咽困难或吃奶越来越差时要咨询。"],"feeding":"多数宝宝这个月仍未正式开始辅食，可提前了解 6 个月左右的准备信号。"},{"month":6,"title":"第 6 个月","focus":"很多宝宝进入辅食起步期，也更会翻身、拿物和发声。","motor":["会翻身，坐时可用手支撑。","会主动伸手拿东西。"],"language":["重复发音增多。"],"social":["更明显认识熟人。"],"support":["加入拍手模仿、镜子、指图。"],"red":["不会翻身且几乎不主动拿物时要留意。"],"feeding":"通常可在发育准备好时开始辅食，奶仍是主要营养来源。"},{"month":7,"title":"第 7 个月","focus":"坐姿更稳，辅食可逐渐丰富。","motor":["独坐能力继续进步。","会双手传递玩具。"],"language":["对名字更敏感。"],"social":["开始表现熟人与陌生人的差异反应。"],"support":["加入传递玩具、拍桌、翻翻书。"],"red":["持续腹泻、便血、进食困难要咨询。"],"feeding":"已开始辅食后可逐渐增加种类和质地，继续观察反应。"},{"month":8,"title":"第 8 个月","focus":"探索空间变大，分离焦虑可能出现。","motor":["可能开始爬行。","手部操作更主动。"],"language":["更专注听常听到的话。"],"social":["更依赖熟悉照护者。"],"support":["躲猫猫、地面探索、翻翻书很适合。"],"red":["几乎完全不愿承重或移动时要留意。"],"feeding":"辅食可更丰富，注意大小、软硬和呛咳风险。"},{"month":9,"title":"第 9 个月","focus":"手部精细动作和自主探索更明显。","motor":["坐得更稳，可能扶站。","更主动抓小东西。"],"language":["叫名字时更容易有反应。"],"social":["会伸手要抱。"],"support":["加入捏取、装放、藏玩具。"],"red":["不会独坐或几乎不用双手探索，应咨询。"],"feeding":"可增加不同食物组和纹理，进食时全程看护。"},{"month":10,"title":"第 10 个月","focus":"模仿和站立意愿更明显。","motor":["会更常扶站或沿家具移动。"],"language":["会模仿拍手、语音和简单动作。"],"social":["喜欢有来回感的互动。"],"support":["容器装放、拍手、音乐律动很适合。"],"red":["出现明显发育退步要尽快咨询。"],"feeding":"继续推进家庭餐桌前的过渡，但食物形态要符合吞咽能力。"},{"month":11,"title":"第 11 个月","focus":"表达需求和模仿能力继续增强。","motor":["站立和移动尝试增多。"],"language":["会更清楚用声音和动作表达想要。"],"social":["会主动把大人拉进互动。"],"support":["多做命名、装放、简单规则游戏。"],"red":["持续不会抓小物或很少表达需求时要留意。"],"feeding":"逐渐接近一日三餐结构，但奶仍然重要。"},{"month":12,"title":"第 12 个月","focus":"从婴儿期过渡到幼儿期，理解力和模仿能力明显增加。","motor":["可能扶走或独站几秒。"],"language":["能理解更多简单词和指令。"],"social":["会更主动参与日常流程。"],"support":["把互动嵌进生活，如收玩具、指东西、挥手。"],"red":["不会扶站、不回应名字、明显退步要留意。"],"feeding":"12 个月后再考虑把牛奶作为主要饮品之一，12 个月前仍以母乳或配方奶为主。"}];</script><script>
/* Little Days · Parent-first edition; all data stays locally unless exported. */
const APP_KEY='little-days-parent-v1',LEGACY_KEY='clover-baby-mobile-clean-v1',DB_NAME='little-days-photos',PHOTO_STORE='photos';

const $=(q,base=document)=>base.querySelector(q);
const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));

const pad=n=>String(n).padStart(2,'0');

const MINUTE=60000;
const defaults=()=>({version:2,baby:{name:'',birthDate:'',feedingMode:'unknown',specialCare:false},reminders:{mode:'anniversary',seenKey:''},feeding:[],sleep:[],diapers:[],notes:[],growth:[],photos:[],activities:[],ui:{role:'caregiver',wakeAt:'',remindAt:null},sleepRunning:null,legacyArchive:null});
let state=defaults(),view={page:'today',date:localDate(new Date()),filter:'all',chart:'feed',month:1,growthTab:'memories',modal:null,edit:null},storageOK=true,toastTimeout=null,photoThumbs=[];

  d.legacyArchive={planner:old.planner||null,videoLibrary:old.videoLibrary||[],photos:old.photos||[],settings:{musicAgeGroup:old.musicAgeGroup,musicMode:old.musicMode,legacyWeightKg:old.profile?.weightKg||''}};

function load(){const st=getStorage();if(!st)return;try{const val=st.getItem(APP_KEY);if(val){state=normalizeApp(JSON.parse(val));return}const legacy=st.getItem(LEGACY_KEY);if(legacy){state=convertLegacy(JSON.parse(legacy));save(false);return}}catch(e){console.warn('Record load failed',e)}}
function save(announce=false){const st=getStorage();if(!st){if(announce)toast('浏览器未提供本地存储，当前数据可能无法保留');return false}try{st.setItem(APP_KEY,JSON.stringify(state));if(announce)toast('已保存到当前浏览器');return true}catch(e){console.error(e);toast('保存失败：设备存储空间不足或浏览器限制，请立即备份');return false}}

function anniversaryDate(b,months){const year=b.getFullYear(),month=b.getMonth()+months;const first=new Date(year,month,1),lastDay=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();return new Date(first.getFullYear(),first.getMonth(),Math.min(b.getDate(),lastDay))}
function monthAge(){if(!state.baby.birthDate)return null;const b=new Date(state.baby.birthDate+'T00:00'),n=new Date();if(isNaN(b)||b>n)return null;const now=new Date(n.getFullYear(),n.getMonth(),n.getDate());let m=(now.getFullYear()-b.getFullYear())*12+now.getMonth()-b.getMonth();if(now<anniversaryDate(b,m))m--;return Math.max(0,m)}

const recordTime=(kind,x)=>kind==='sleep'?x.start:x.at;
function sleepMins(day){const start=dayStart(day),end=start+86400000;return state.sleep.reduce((sum,x)=>{const a=new Date(x.start).getTime(),b=new Date(x.end).getTime();return sum+(Number.isFinite(a)&&Number.isFinite(b)&&b>a?Math.max(0,Math.min(b,end)-Math.max(a,start))/MINUTE:0)},0)}
function onDate(day,kind){if(kind==='sleep')return state.sleep.filter(x=>{const a=Date.parse(x.start),b=Date.parse(x.end);return b>dayStart(day)&&a<dayStart(day)+86400000});const k=kind==='feed'?'feeding':kind==='diaper'?'diapers':kind==='note'?'notes':'growth';return state[k].filter(x=>dateKey(x.at)===day)}
function metrics(day){const feeds=onDate(day,'feed'),diapers=onDate(day,'diaper'),notes=onDate(day,'note'),minutes=sleepMins(day),vol=feeds.reduce((a,x)=>a+(Number(x.ml)||0),0);return {feeds,diapers,notes,minutes,vol}}
const hoursLabel=mins=>`${Math.floor(mins/60)}小时${Math.round(mins%60)?`${Math.round(mins%60)}分`:''}`;
function dayEvents(day){return [{kind:'feed',data:onDate(day,'feed')},{kind:'sleep',data:onDate(day,'sleep')},{kind:'diaper',data:onDate(day,'diaper')},{kind:'note',data:onDate(day,'note')},{kind:'measure',data:onDate(day,'measure')}].flatMap(g=>g.data.map(x=>({kind:g.kind,x}))).sort((a,b)=>new Date(recordTime(b.kind,b.x))-new Date(recordTime(a.kind,a.x)))}
function eventTitle(kind,x){if(kind==='feed'){const mode={breast:'母乳亲喂',formula:'配方奶',expressed:'母乳瓶喂',mixed:'其他喂养'}[x.mode]||'喂养';const parts=[x.ml?`${x.ml} ml`:'',x.minutes?`${x.minutes} 分钟`:''].filter(Boolean);return `${mode}${parts.length?' · '+parts.join(' / '):''}`}
 if(kind==='sleep')return `睡眠 · ${hoursLabel(Math.max(0,(Date.parse(x.end)-Date.parse(x.start))/MINUTE))}`;
 if(kind==='diaper')return {'pee':'尿湿','poop':'排便','both':'尿湿 + 排便'}[x.kind]||'尿布';
 if(kind==='measure')return `${x.kg?x.kg+' kg':''}${x.kg&&x.cm?' · ':''}${x.cm?x.cm+' cm':''}`;
 return {'movement':'动作','language':'语言','social':'社交','daily':'日常观察'}[x.domain]||'今天的小发现';}
function eventDesc(kind,x){if(kind==='sleep')return `${readableTime(x.start)} – ${readableTime(x.end)}${x.note?' · '+esc(x.note):''}`;return esc(x.note|| (kind==='note'?'记下一次值得纪念的小变化':'暂无备注'))}
function eventList(events,edit=true){if(!events.length)return `<div class="empty">${icon('clipboard')}<div>这一天还没有记录<br><span class="trace">点击「新增记录」开始</span></div></div>`;return `<div class="list">${events.map(({kind,x})=>`<div class="list-row"><div class="event-icon">${icon(TYPES[kind].icon)}</div><div class="event-main"><div class="event-title">${esc(eventTitle(kind,x))}</div><div class="event-sub">${eventDesc(kind,x)}</div></div><span class="event-time">${readableTime(recordTime(kind,x))}</span>${edit?`<div class="record-actions"><button class="tiny" data-action="edit" data-kind="${kind}" data-id="${esc(x.id)}" aria-label="编辑记录">${icon('edit')}</button><button class="tiny" data-action="delete" data-kind="${kind}" data-id="${esc(x.id)}" aria-label="删除记录">${icon('trash')}</button></div>`:''}</div>`).join('')}</div>`}
function head(label,title,description,right=''){return `<div class="page-header"><div><h1 class="heading">${esc(title)}</h1><p class="desc">${description}</p></div>${right}</div>`}

const ambient={context:null,source:null,gain:null,filter:null,playing:false,type:'white',minutes:30,volume:12,endAt:0,timer:null};
function noiseBuffer(ctx,type){const length=ctx.sampleRate*6,buf=ctx.createBuffer(1,length,ctx.sampleRate),out=buf.getChannelData(0);let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;for(let i=0;i<length;i++){const r=Math.random()*2-1;if(type==='pink'){b0=.99886*b0+r*.0555179;b1=.99332*b1+r*.0750759;b2=.969*b2+r*.153852;b3=.8665*b3+r*.3104856;b4=.55*b4+r*.5329522;b5=-.7616*b5-r*.016898;out[i]=Math.max(-1,Math.min(1,(b0+b1+b2+b3+b4+b5+b6+r*.5362)*.10));b6=r*.115926}else out[i]=r*.25}return buf}
function updateAmbientUI(){document.querySelectorAll('[data-action="ambient-toggle"]').forEach(b=>{b.classList.toggle('playing',ambient.playing);b.innerHTML=b.classList.contains('ambient-top')?`${icon(ambient.playing?'stop':'moon')}<span>${ambient.playing?'停止':'白噪音'}</span>`:`${icon(ambient.playing?'stop':'moon')} ${ambient.playing?'停止播放':'播放'}`});document.querySelectorAll('[data-sound]').forEach(b=>b.classList.toggle('active',b.dataset.sound===ambient.type));const mins=ambient.playing?Math.max(0,Math.ceil((ambient.endAt-Date.now())/60000)):0;document.querySelectorAll('.ambient-status').forEach(e=>e.innerHTML=ambient.playing?`<span class="sound-dot"></span>正在播放 · 约 ${mins} 分钟后停止`:'尚未播放');document.querySelectorAll('.ambient-mini').forEach(e=>e.remove());if(ambient.playing&&view.page!=='today'){const bar=document.createElement('div');bar.className='ambient-mini';bar.innerHTML=`<span class="sound-dot"></span>轻柔白噪音 · ${mins} 分钟 <button class="btn" data-action="ambient-toggle">停止</button>`;document.body.append(bar)}}
function stopAmbient(silent=false){if(ambient.timer){clearInterval(ambient.timer);ambient.timer=null}const src=ambient.source,context=ambient.context,gain=ambient.gain;ambient.playing=false;ambient.source=null;ambient.context=null;ambient.gain=null;ambient.filter=null;ambient.endAt=0;if(gain&&context){try{gain.gain.cancelScheduledValues(context.currentTime);gain.gain.setTargetAtTime(0,context.currentTime,.08)}catch{}}if(src){setTimeout(()=>{try{src.stop()}catch{}},380)}if(context)setTimeout(()=>context.close().catch(()=>{}),600);updateAmbientUI();if(!silent)toast('已停止白噪音')}
async function startAmbient(){if(ambient.playing){stopAmbient();return}const AudioClass=window.AudioContext||window.webkitAudioContext;if(!AudioClass)return toast('当前浏览器不支持离线生成白噪音。可换用 Safari 或 Chrome');try{const ctx=new AudioClass();const src=ctx.createBufferSource();src.buffer=noiseBuffer(ctx,ambient.type);src.loop=true;const filter=ctx.createBiquadFilter();filter.type=ambient.type==='rain'?'bandpass':'lowpass';filter.frequency.value=ambient.type==='rain'?900:1800;filter.Q.value=ambient.type==='rain'?.42:.7;const gain=ctx.createGain();gain.gain.value=0;src.connect(filter);filter.connect(gain);gain.connect(ctx.destination);await ctx.resume();src.start();const target=(ambient.volume/100)*.16;gain.gain.setTargetAtTime(target,ctx.currentTime,.14);ambient.context=ctx;ambient.source=src;ambient.gain=gain;ambient.filter=filter;ambient.playing=true;ambient.endAt=Date.now()+ambient.minutes*60000;ambient.timer=setInterval(()=>{if(!ambient.playing)return;if(Date.now()>=ambient.endAt)stopAmbient(true);else updateAmbientUI()},15000);updateAmbientUI()}catch(e){stopAmbient(true);toast('播放失败，请检查浏览器音频权限并重新点击')}}
async function setAmbientSound(t){if(!['white','pink','rain'].includes(t))return;const was=ambient.playing;if(was)stopAmbient(true);ambient.type=t;updateAmbientUI();if(was)await startAmbient()}
function ambientCard(){return `<section class="card ambient-card"><div class="ambient-head"><div><span class="care-kicker">SOUND · 轻柔安抚</span><h2>白噪音，一键播放</h2><p>无需打开其他应用，音频在手机本地生成。</p></div><button class="ambient-play ${ambient.playing?'playing':''}" data-action="ambient-toggle">${icon(ambient.playing?'stop':'moon')}${ambient.playing?'停止播放':'播放'}</button></div><div class="ambient-choices"><button class="sound-choice ${ambient.type==='white'?'active':''}" data-sound="white">白噪音</button><button class="sound-choice ${ambient.type==='pink'?'active':''}" data-sound="pink">柔和粉噪</button><button class="sound-choice ${ambient.type==='rain'?'active':''}" data-sound="rain">轻雨声</button></div><div class="ambient-bottom"><label>定时关闭 <select id="ambientTimer" aria-label="白噪音自动关闭时间">${[15,30,60].map(n=>`<option value="${n}" ${n===ambient.minutes?'selected':''}>${n} 分钟</option>`).join('')}</select></label><label>页面音量 <input id="ambientVolume" aria-label="白噪音音量" type="range" min="3" max="30" value="${ambient.volume}"></label></div><div class="ambient-status">${ambient.playing?'正在播放':'尚未播放'}</div><p class="ambient-note">请将手机放在婴儿床外、尽可能远离宝宝，调低设备系统音量，短时使用；本页面无法测量宝宝耳边分贝。锁屏或切换 App 后能否继续播放取决于手机浏览器。</p></section>`}
function monthlyPriorityCard(){const age=monthAge(),n=currentCareMonth();if(age===null)return `<section class="card priority-card"><span class="care-kicker">AGE GUIDE · 当前月龄</span><h2>先填写宝宝出生日期</h2><p>资料填写后，只会显示当前实际月龄的照护建议，不展示其他月份的内容。</p><div class="priority-footer"><button class="btn soft" data-page="settings">设置宝宝资料</button></div></section>`;if(age>=12)return `<section class="card priority-card"><h2>婴儿期个性化指南已结束</h2><p>当前版本只覆盖 0–11 月龄，不能将婴儿指导继续套用到幼儿阶段。</p></section>`;const p=CARE_PLANS[n-1];return `<section class="card priority-card"><span class="care-kicker">AGE GUIDE · ${age===0?'出生未满 1 个月':`已满 ${age} 个月`}</span><h2>现在重点：${esc(p.title)}</h2><p>仅展示当前月龄，操作可以结合宝宝当天的真实状态调整。</p><ul class="priority-steps">${makePrioritySteps(p.tasks)}</ul><div class="priority-footer"><button class="textbtn" data-page="guide">查看本月具体做法 ${icon('arrow')}</button></div></section>`}

function activeFoodStage(){const m=currentCareMonth();return FOOD_STAGE[Math.max(0,(m||1)-1)]}
function foodStageTitle(food){const age=monthAge();return age===0?'出生未满 1 个月 · 奶与生长':`已满 ${age} 个月 · ${String(food.title).split('｜')[1]||'饮食提醒'}`}
function latestWeight(){const items=[...state.growth].filter(x=>Number(x.kg)>0&&Number(x.kg)<30&&x.at).sort((a,b)=>Date.parse(b.at)-Date.parse(a.at));return items[0]||null}

function monthlyDigestUnread(){return !!state.baby.birthDate&&monthAge()!==null&&monthAge()<12&&state.reminders?.seenKey!==monthKey()}

 // AAP: ~2.5 US fluid ounces / pound / day = 162.99 mL/kg/day, usually <=~960 mL/day.

 // These ranges flag a time to observe tiredness, not a prescribed wake window or bedtime.
 const longAwake=wakeMinutes!==null&&wakeMinutes>(age<=3?100:age<=6?155:age<=9?190:210);
 let candidates=items.filter(a=>!afterFeed||calmIds.has(a.id));
 if(!candidates.length)candidates=items;
 const now=Date.now(),todayLogs=v5Logs(),last3=safeArray(state.activities).filter(x=>Number.isFinite(Date.parse(x.at))&&now-Date.parse(x.at)<3*86400000);
 const categoryCounts={};todayLogs.forEach(x=>{const a=v5Activity(x.activityId);if(a)categoryCounts[a.category]=(categoryCounts[a.category]||0)+1});
 const switchId=state.ui?.activitySwitchId,validSwitch=state.ui?.activitySwitchAt&&now-state.ui.activitySwitchAt<45*60000;
 const scored=candidates.map((a,index)=>{

   const count3=last3.filter(x=>x.activityId===a.id).length;
   const cat=categoryCounts[a.category]||0;
   const calm=calmIds.has(a.id);
   let score=(countToday?-(12+countToday*5):9)-count3*2-cat*3;
   if(longAwake)score+=calm?10:-7;
   if(afterFeed)score+=calm?6:-8;
   if(!wake.known)score+=calm?3:0;
   if(validSwitch&&switchId===a.id)score+=40;
   return {a,score,index};
 }).sort((a,b)=>b.score-a.score||a.index-b.index);
 const best=scored[0]?.a||null;
 let reason='按照宝宝当前月龄推荐；还没有足够的作息记录，先从轻松的小互动开始。';
 if(afterFeed)reason='刚喂过奶，可以先选择安静的交流或绘本；是否活动，以宝宝舒服为准。';
 else if(longAwake)reason='宝宝清醒了一段时间，先观察有没有困意；如果精神不错，可以试试这个温和活动。';
 else if(wake.known)reason='根据今天记录的醒来时间和已做过的活动，为你换一种适龄玩法。';
 else if(todayLogs.length)reason='根据今天已做过的活动，换一种内容，不用反复做同一个。';
 if(validSwitch&&switchId===best?.id)reason='已按你的选择切换活动；宝宝不感兴趣可以再换一种。';

function field(label,control,help=''){return `<div class="field"><label>${label}</label>${control}${help?`<small>${help}</small>`:''}</div>`}
function input(name,type,value='',options=''){return `<input class="input" id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${options}>`}
function select(name,choices,val){return `<select class="select" id="f_${name}" name="${name}">${choices.map(([v,l])=>`<option value="${v}" ${val===v?'selected':''}>${l}</option>`).join('')}</select>`}

function formMarkup(kind,record){const x=record||{},now=nowLocal(),at=x.at||now;
 if(kind==='feed')return `${field('喂养时间',input('at','datetime-local',at,'required'))}${field('喂养方式',select('mode',[['breast','母乳亲喂'],['formula','配方奶'],['expressed','母乳瓶喂'],['mixed','其他']],x.mode||'breast'))}<div class="twocol">${field('奶量（ml）',input('ml','number',x.ml||'','min="0" max="2000" step="1" placeholder="瓶喂可填"'))}${field('亲喂 / 喂养时长（分钟）',input('minutes','number',x.minutes||'','min="0" max="240" step="1" placeholder="亲喂可填"'))}</div>${field('备注',textarea('note',x.note||''),'母乳亲喂无需硬填奶量；至少填写奶量或时长。')}`;
 if(kind==='sleep')return `<div class="twocol">${field('开始时间',input('start','datetime-local',x.start||now,'required'))}${field('结束时间',input('end','datetime-local',x.end||now,'required'))}</div>${field('备注',textarea('note',x.note||'','可选：例如夜醒、安抚情况'))}<div class="notice">跨午夜的睡眠会按每天实际睡眠的时段分别计入统计。</div>`;
 if(kind==='diaper')return `${field('更换时间',input('at','datetime-local',at,'required'))}${field('尿布情况',select('kind',[['pee','尿湿'],['poop','排便'],['both','尿湿 + 排便']],x.kind||'pee'))}${field('情况 / 备注',textarea('note',x.note||'','例如颜色、性状；无需每次填写'))}`;
 if(kind==='note')return `${field('观察时间',input('at','datetime-local',at,'required'))}${field('观察类型',select('domain',[['daily','日常瞬间'],['movement','动作发展'],['language','语言互动'],['social','社交情绪']],x.domain||'daily'))}${field('记录内容',textarea('note',x.note||'','今天有什么新发现？宝宝喜欢做什么？'))}`;
 if(kind==='measure')return `${field('测量时间',input('at','datetime-local',at,'required'))}<div class="twocol">${field('体重（kg）',input('kg','number',x.kg??'','min="0" max="70" step="0.01" placeholder="可选"'))}${field('身长 / 身高（cm）',input('cm','number',x.cm??'','min="0" max="180" step="0.1" placeholder="可选"'))}</div>${field('备注',textarea('note',x.note||'','例如家中测量、就诊体检等'))}`;
 return ''}
function openModal(kind,id=null){if(!TYPES[kind])return;const arr=arrFor(kind),x=id?arr.find(y=>String(y.id)===String(id)):null;view.modal=kind;view.edit=x?.id||null;
 $('#modal').innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${id?'编辑':'新增'}${TYPES[kind].label}"><div class="sheet-head"><h2>${id?'编辑':'新增'}${TYPES[kind].label}</h2><button class="close" aria-label="关闭" data-action="close-modal">${icon('close')}</button></div><div class="sheet-body"><form id="recordForm" data-kind="${kind}">${formMarkup(kind,x)}<div class="alertline" id="formError" style="display:none"></div><div class="sheet-actions"><button class="btn" type="button" data-action="close-modal">取消</button><button class="btn primary" type="submit">${icon('check')}保存记录</button></div></form></div></div>`;
 $('#modal').classList.add('open');setTimeout(()=>$('#modal input')?.focus(),20)
}

function arrFor(kind){return ({feed:state.feeding,sleep:state.sleep,diaper:state.diapers,note:state.notes,measure:state.growth})[kind]}
function writeRecord(form){const kind=form.dataset.kind;const fd=new FormData(form);const v=name=>String(fd.get(name)||'').trim();const dateField=kind==='sleep'?'start':'at';const at=v(dateField);const stamp=Date.parse(at);if(!Number.isFinite(stamp))return error('请选择有效记录时间');if(stamp>Date.now()+MINUTE*5)return error('不能记录未来的时间');let x={id:view.edit||uid()};
 if(kind==='feed'){
  const ml=v('ml')?Number(v('ml')):null,minutes=v('minutes')?Number(v('minutes')):null;
  if((ml===null||ml<=0)&&(minutes===null||minutes<=0))return error('请至少填写奶量或喂养时长');
  if(ml!==null&&(!Number.isFinite(ml)||ml<=0||ml>2000))return error('奶量范围请填写 1–2000 ml');
  if(minutes!==null&&(!Number.isFinite(minutes)||minutes<=0||minutes>240))return error('喂养时长范围请填写 1–240 分钟');
  x={...x,at,mode:v('mode'),ml,minutes,note:v('note')};
 }else if(kind==='sleep'){
  const end=v('end'),e=Date.parse(end);if(!Number.isFinite(e)||e<=stamp)return error('睡眠结束时间必须晚于开始时间');if(e>Date.now()+MINUTE*5)return error('睡眠结束时间不能在未来');if(e-stamp>24*60*MINUTE)return error('单段睡眠超过 24 小时，请拆分记录');x={...x,start:at,end,note:v('note')};
 }else if(kind==='diaper'){x={...x,at,kind:v('kind'),note:v('note')}}
 else if(kind==='note'){if(!v('note'))return error('请填写观察内容');x={...x,at,domain:v('domain'),note:v('note')}}
 else if(kind==='measure'){
  const kg=v('kg')?Number(v('kg')):null,cm=v('cm')?Number(v('cm')):null;
  if(kg===null&&cm===null)return error('请至少填写身高或体重');
  if(kg!==null&&(!Number.isFinite(kg)||kg<=0||kg>70))return error('请核对体重数值');
  if(cm!==null&&(!Number.isFinite(cm)||cm<=0||cm>180))return error('请核对身高数值');x={...x,at,kg,cm,note:v('note')};
 }
 const arr=arrFor(kind);if(view.edit){const i=arr.findIndex(y=>String(y.id)===String(view.edit));if(i<0)return error('原记录不存在');arr[i]=x}else arr.push(x);
 save();closeModal();render();toast('记录已保存')
}
function deleteRecord(kind,id){const arr=arrFor(kind);const r=arr?.find(x=>String(x.id)===String(id));if(!r)return;if(!confirm('确定删除这条'+TYPES[kind].label+'记录吗？此操作无法撤销。'))return;arr.splice(arr.indexOf(r),1);save();render();toast('已删除')}
function startSleep(){if($('#modal')?.classList.contains('open'))closeModal();if(state.sleepRunning)return;state.sleepRunning=nowLocal();if(save()){render();toast('已开始记录睡眠')}}
function stopSleep(){if(!state.sleepRunning)return;const start=state.sleepRunning,end=nowLocal();if(Date.parse(end)<=Date.parse(start))return toast('记录时间过短，请稍后再结束');if(!confirm(`确定结束从 ${readableTime(start)} 开始的睡眠吗？`))return;state.sleep.push({id:uid(),start,end,note:''});state.sleepRunning=null;state.ui={...state.ui,wakeAt:end,activityMood:'',activitySwitchId:''};save();render();toast('睡眠已保存，已根据醒来时间更新活动建议')}

function openDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('浏览器不支持照片存储'));const q=indexedDB.open(DB_NAME,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(PHOTO_STORE))q.result.createObjectStore(PHOTO_STORE,{keyPath:'id'})};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function dbAll(){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(PHOTO_STORE,'readonly'),r=tx.objectStore(PHOTO_STORE).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error);tx.oncomplete=()=>db.close()})}
async function dbPut(rec){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(PHOTO_STORE,'readwrite');tx.objectStore(PHOTO_STORE).put(rec);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function dbDelete(id){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(PHOTO_STORE,'readwrite');tx.objectStore(PHOTO_STORE).delete(id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function dbReplace(items){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(PHOTO_STORE,'readwrite'),store=tx.objectStore(PHOTO_STORE);store.clear();items.forEach(x=>store.put(x));tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function loadGallery(){const box=$('#photoGallery');if(!box)return;const fallbacks=safeArray(state.photos).filter(p=>p&&p.src);let database=[];try{database=await dbAll()}catch(e){console.warn('Photo database unavailable; trying local backup',e)}const seen=new Map();[...database,...fallbacks].forEach(p=>seen.set(p.id,p));photoThumbs=[...seen.values()].sort((a,b)=>Date.parse(b.at)-Date.parse(a.at));if($('#photoGallery')){const photos=view.page==='report'?v5DatePhotos(view.date):photoThumbs;$('#photoGallery').innerHTML=photos.length?photoGrid(photos):'<div class="v5-photo-empty">还没有照片，点上方“上传照片”试试。</div>'}}
function compressPhoto(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{const scale=Math.min(1,1500/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale)),canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);const data=canvas.toDataURL('image/jpeg',.8);URL.revokeObjectURL(url);resolve(data)}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('照片无法读取'))};img.src=url})}
async function addPhotos(files,note){const list=Array.from(files||[]);if(!list.length)return;let added=0,failed=0,localCount=0;for(const f of list.slice(0,10)){if(!f.type.startsWith('image/')){failed++;continue}try{const src=await compressPhoto(f),rec={id:uid(),at:nowLocal(),note:note||'',name:f.name,src};try{await dbPut(rec);state.photos.push({id:rec.id,at:rec.at,note:rec.note,name:f.name})}catch(e){console.warn('IndexedDB unavailable: trying local save',e);state.photos.push({...rec,localFallback:true});if(!save()){state.photos.pop();failed++;continue}localCount++}added++}catch(e){console.warn('photo failed',e);failed++}}if(added){save();await loadGallery();render();toast(`已保存 ${added} 张照片${localCount?'（使用当前浏览器的备用存储）':''}${failed?'，'+failed+'张未成功':''}`)}else toast('照片未能保存，请检查图片格式和浏览器存储权限')}
async function removePhoto(id){if(!confirm('确定删除这张成长相片吗？'))return;try{await dbDelete(id)}catch(e){console.warn('DB delete skipped',e)}state.photos=state.photos.filter(x=>x.id!==id);photoThumbs=photoThumbs.filter(x=>x.id!==id);save();render();toast('照片已删除')}
function downloadJSON(data,name){const blob=new Blob([JSON.stringify(data)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
async function exportBackup(){try{toast('正在整理完整备份…');let photos=[];try{photos=await dbAll()}catch(e){if(state.photos.length&&!confirm('照片数据库无法读取，备份可能不包含照片。是否继续导出文字记录？'))return}
 const merged=new Map();[...photos,...safeArray(state.photos).filter(p=>p&&p.src)].forEach(p=>merged.set(p.id,p));photos=[...merged.values()];const data={format:'little-days-backup',version:1,createdAt:new Date().toISOString(),data:clone(state),photoRecords:photos};downloadJSON(data,`天使宝宝完整备份_${localDate(new Date())}.json`);toast(`备份文件已生成，包含 ${photos.length} 张照片`)}catch(e){toast('备份失败：'+e.message)}}
function parseOldBackup(pack){
 const raw=pack.localStorage?.[LEGACY_KEY];
 if(!raw)throw Error('旧备份中没有找到宝宝的主要记录');
 const v=JSON.parse(raw),converted=convertLegacy(v),files=[];
 const manifest=safeArray(JSON.parse(pack.localStorage?.['standalone-baby-photo-manifest-v9']||'[]'));
 const records=Object.values(pack.photoDatabases||{}).flat().filter(Boolean),map=new Map();
 const imgData=r=>[r?.full,r?.src,r?.data,r?.image,r?.blob?.data,r?.thumb].find(t=>typeof t==='string'&&t.startsWith('data:image/'))||'';
 for(const r of records){const src=imgData(r);if(src&&r.id)map.set(String(r.id),{id:String(r.id),src,at:r.meta?.createdAt||r.createdAt||nowLocal(),note:r.meta?.note||''})}
 const used=new Set();
 for(const item of manifest){if(!item?.id)continue;const id=String(item.id),base=map.get(id),src=base?.src||imgData(item);if(!src)continue;files.push({id,at:item.createdAt||(item.dayKey?item.dayKey+'T12:00:00':null)||base?.at||nowLocal(),note:String(item.note||base?.note||''),name:item.fileName||'',src});used.add(id)}
 for(const rec of map.values())if(!used.has(rec.id)){files.push(rec);used.add(rec.id)}
 // Some early revisions saved images directly on state.photos rather than in photo DBs.
 for(const item of safeArray(v.photos)){if(!item?.id||used.has(String(item.id)))continue;const src=imgData(item);if(!src)continue;files.push({id:String(item.id),at:item.timestamp||item.createdAt||(item.dayKey?item.dayKey+'T12:00:00':nowLocal()),note:String(item.note||''),name:item.fileName||'',src});used.add(String(item.id))}
 converted.photos=files.map(({id,at,note,name})=>({id,at,note,name}));return {data:converted,photos:files}
}

async function importBackup(file){if(!file)return;if(file.size>180*1024*1024)return toast('文件过大；请先确认这是真实备份文件（上限180MB）');let pack,parsed;try{pack=JSON.parse(await file.text());if(pack?.format==='little-days-backup'&&pack.data)parsed={data:normalizeApp(pack.data),photos:safeArray(pack.photoRecords)};else if(pack?.format==='clover-backup'&&pack.localStorage)parsed=parseOldBackup(pack);else if(pack?.profile&&('milk' in pack||'sleep' in pack))parsed={data:convertLegacy(pack),photos:[]};else throw Error('文件格式不兼容');
 if(parsed.photos.some(p=>!p||typeof p.id!=='string'||typeof p.src!=='string'||!p.src.startsWith('data:image/')))throw Error('照片内容存在不支持的格式');if(!confirm(`检测到 ${parsed.data.feeding.length} 条喂养、${parsed.data.sleep.length} 条睡眠、${parsed.photos.length} 张照片。\n导入将覆盖新版当前全部数据。建议先导出当前备份。\n确定导入吗？`))return;
 const oldData=clone(state);let oldPhotos=[];try{oldPhotos=await dbAll()}catch(e){}
 try{await dbReplace(parsed.photos);state=normalizeApp(parsed.data);if(!save())throw Error('无法写入本地存储');view.page='today';render();toast(`恢复完成：${parsed.photos.length} 张照片`)}catch(e){state=oldData;save();try{await dbReplace(oldPhotos)}catch{}toast('恢复失败，已尝试还原原有数据：'+e.message)}}catch(e){toast('导入失败：'+e.message)}}
async function clearAll(){if(!confirm('确定删除新版中所有记录和照片吗？此操作无法撤销。请先导出备份。'))return;const answer=prompt('请输入“删除”以再次确认：');if(answer!=='删除')return;try{await dbReplace([]);state=defaults();save();view.page='today';render();toast('已清空新版数据；旧版文件未受影响')}catch(e){toast('清除失败：'+e.message)}}
function registerV5Events(){
 document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action;
 if(!['activity-done','activity-detail','activity-remove','switch-role','wake-now','activity-remind','quick-photo','open-quick','print-report','smart-mood','smart-next'].includes(a))return;
 e.stopImmediatePropagation();e.preventDefault();
 if(a==='activity-done')v5MarkActivity(b.dataset.id);
 else if(a==='activity-detail')v5ActivityModal(b.dataset.id);
 else if(a==='activity-remove')v5RemoveActivity(b.dataset.id);
 else if(a==='switch-role')v5SetRole(state.ui?.role==='parent'?'caregiver':'parent');
 else if(a==='wake-now')v5WakeNow();
 else if(a==='smart-mood')v56SetMood(b.dataset.mood);
 else if(a==='smart-next')v56ChooseDifferent();
 else if(a==='activity-remind')v5Reminder(15);
 else if(a==='quick-photo'){if($('#modal')?.classList.contains('open'))closeModal();$('#v5PhotoInput')?.click();}
 else if(a==='open-quick')v5ChooseRecord();
 else if(a==='print-report')window.print();
 },true);
 document.addEventListener('submit',e=>{if(e.target.id==='v5ActivityNoteForm'){e.preventDefault();e.stopImmediatePropagation();v5LogActivityForm(e.target)}},true);
 document.addEventListener('change',async e=>{if(e.target.id==='v5PhotoInput'){const fs=Array.from(e.target.files||[]);e.target.value='';await addPhotos(fs,'');if(view.page==='report')loadGallery()}else if(e.target.id==='v5ReportDate'){view.date=e.target.value;render()}},true);
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()},false);
 setInterval(v5RemindCheck,14000);
}
function registerEvents(){document.addEventListener('click',async e=>{const btn=e.target.closest('[data-page],[data-action],[data-chart],[data-growth-tab],[data-month],[data-sound]');if(!btn){if(e.target.id==='modal')closeModal();return}if(btn.dataset.page){go(btn.dataset.page);return}if(btn.dataset.sound){setAmbientSound(btn.dataset.sound);return}if(btn.dataset.chart){view.chart=btn.dataset.chart;render();return}if(btn.dataset.growthTab){view.growthTab=btn.dataset.growthTab;render();return}if(btn.dataset.month){toast('本试用版只展示宝宝的当前实际月龄');return}const action=btn.dataset.action;if(action==='ambient-toggle')startAmbient();else if(action==='open')openModal(btn.dataset.kind);else if(action==='close-modal')closeModal();else if(action==='edit')openModal(btn.dataset.kind,btn.dataset.id);else if(action==='delete')deleteRecord(btn.dataset.kind,btn.dataset.id);else if(action==='monthly-detail')monthlyBriefModal();else if(action==='safety-help')openSafetyHelp();else if(action==='mark-brief')markMonthlyBrief();else if(action==='export-ics')makeCalendarReminder();else if(action==='start-sleep')startSleep();else if(action==='stop-sleep')stopSleep();else if(action==='photo-upload')$('#photoUpload')?.click();else if(action==='delete-photo')await removePhoto(btn.dataset.id);else if(action==='export')await exportBackup();else if(action==='choose-import')$('#backupFile')?.click();else if(action==='clear')await clearAll();});
 document.addEventListener('submit',e=>{if(e.target.id==='reminderForm'){e.preventDefault();state.reminders={...state.reminders,mode:new FormData(e.target).get('mode')||'anniversary',seenKey:''};save();render();toast('已更新提醒时间规则');return;}if(e.target.id==='recordForm'){e.preventDefault();writeRecord(e.target)}if(e.target.id==='profileForm'){e.preventDefault();const data=new FormData(e.target),name=String(data.get('name')||'').trim(),birthDate=String(data.get('birthDate')||'');if(birthDate&&Date.parse(birthDate)>Date.now())return toast('出生日期不能在未来');const previousBirth=state.baby.birthDate;const feedingMode=String(data.get('feedingMode')||'unknown');state.baby={...state.baby,name,birthDate,feedingMode,specialCare:data.get('specialCare')==='yes'};if(previousBirth!==birthDate)state.reminders.seenKey='';save();render();toast('宝宝资料已保存，月龄建议已更新')}});
 document.addEventListener('change',async e=>{if(e.target.id==='ambientTimer'){ambient.minutes=Number(e.target.value)||30;if(ambient.playing)ambient.endAt=Date.now()+ambient.minutes*60000;updateAmbientUI()}else if(e.target.id==='dateFilter'){view.date=e.target.value;render()}else if(e.target.id==='kindFilter'){view.filter=e.target.value;render()}else if(e.target.id==='photoUpload'){const files=e.target.files;const note=$('#photoCaption')?.value.trim()||'';await addPhotos(files,note)}else if(e.target.id==='backupFile'){const f=e.target.files?.[0];e.target.value='';await importBackup(f)}});
 document.addEventListener('input',e=>{if(e.target.id==='ambientVolume'){ambient.volume=Number(e.target.value)||3;if(ambient.gain&&ambient.context)ambient.gain.gain.setTargetAtTime((ambient.volume/100)*.16,ambient.context.currentTime,.10)}});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal')?.classList.contains('open'))closeModal()});
}
function boot(){load();makeNav();registerV5Events();registerEvents();view.month=currentCareMonth();render();document.addEventListener('visibilitychange',()=>{if(!document.hidden){view.month=currentCareMonth();render()}})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();

</script>
</body></html>
